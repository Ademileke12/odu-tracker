<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ODU Tracker</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #05070b; color: #e8eaf0;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    text-align: center;
  }
  .wrap { padding: 24px; user-select: none; max-width: 460px; }
  .logo {
    width: 76px; height: 76px; border-radius: 20px; margin: 0 auto 18px;
    background: #ffb632; display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 800; color: #221701;
    box-shadow: 0 0 44px rgba(255,182,50,.35);
  }
  h1 { font-size: 20px; margin: 0 0 6px; letter-spacing: .04em; }
  p  { color: #8b93a5; font-size: 13px; margin: 0; }
  .bar {
    width: 240px; height: 8px; border-radius: 4px; margin: 22px auto 0;
    background: #131a26; overflow: hidden;
  }
  .bar i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #ffb632, #ffe08a, #22d3ee);
    transition: width .3s ease;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">⚡</div>
    <h1>ODU TRACKER</h1>
    <p id="msg">Starting the engine…</p>
    <div class="bar" id="bar" hidden><i id="fill"></i></div>
  </div>
  <script>
    // driven by the Electron main process (no nodeIntegration needed)
    window.__engineProgress = function (pct, label) {
      var msg = document.getElementById('msg');
      var bar = document.getElementById('bar');
      var fill = document.getElementById('fill');
      if (label) msg.textContent = label;
      if (pct == null) { bar.hidden = true; fill.style.width = '0%'; return; }
      bar.hidden = false;
      fill.style.width = pct + '%';
    };
  </script>
</body>
</html>

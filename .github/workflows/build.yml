# ODU Tracker — build everything, publish everything.
#
# * every push: artifacts are attached to the workflow run for testing
# * every tag (v1.2.3 …): a GitHub Release is created with ALL installers:
#     ODU-Tracker-Setup.exe            (Windows NSIS installer, engine bundled)
#     ODU-Tracker-Portable.exe         (Windows portable exe)
#     odu-tracker-engine-windows-x64.exe  (engine only, Electron fallback)
#     odu-tracker-amd64.deb            (Linux .deb, engine bundled)
#     ODU-Tracker.apk                  (Android, release-signed)
#
# The website's download buttons point at
#   https://github.com/Ademileke12/odu-tracker/releases/latest/download/<file>
# so whatever CI produces last becomes what users download.
name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- android
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake build-essential libtool libltdl-dev \
            ccache pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev

      - name: Install buildozer + cython
        run: pip install buildozer cython

      - name: Build release APK
        working-directory: android_app
        env:
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/android_app/odu-tracker-release.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: odu-tracker-2026
          P4A_RELEASE_KEYALIAS_PASSWD: odu-tracker-2026
          P4A_RELEASE_KEYALIAS: odu-tracker
        run: buildozer -v android release

      - name: Collect APK
        run: |
          mkdir -p out
          cp android_app/bin/*-release.apk out/ODU-Tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ODU-Tracker.apk
          path: out/ODU-Tracker.apk
          if-no-files-found: error

  # ---------------------------------------------------------------- linux
  linux:
    name: Linux .deb
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # electron 45 requires node >= 22.12
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build .deb (engine + Electron shell)
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt pyinstaller
          ./tools/build_electron.sh

      - uses: actions/upload-artifact@v4
        with:
          name: odu-tracker-amd64.deb
          path: dist/electron/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------- windows
  windows:
    name: Windows installers
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # electron 45 requires node >= 22.12
          node-version: "22"

      - name: Build engine + NSIS + portable
        shell: cmd
        run: packaging\windows\build-electron.bat

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/electron/ODU-Tracker-Setup.exe out/
          Copy-Item dist/electron/ODU-Tracker-Portable.exe out/
          Copy-Item packaging/electron/resources/odu-tracker-server/odu-tracker-server.exe out/odu-tracker-engine-windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ODU-Tracker-Windows
          path: out/
          if-no-files-found: error

  # ---------------------------------------------------------------- release
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: rel

      - name: Flatten artifacts
        run: |
          mkdir -p rel
          find rel -type f \( -name "*.apk" -o -name "*.deb" -o -name "*.exe" \) \
            -exec cp {} rel/ \;
          ls -la rel/

      - name: Create GitHub Release with all installers
        uses: softprops/action-gh-release@v2
        with:
          name: ODU Tracker ${{ github.ref_name }}
          body: |
            **ODU Tracker ${{ github.ref_name }}** — install-and-use apps for the MTN Broadband 5G ODU (ZLT X28).

            | Platform | File | Notes |
            |---|---|---|
            | Windows | `ODU-Tracker-Setup.exe` | one-click installer, engine bundled |
            | Windows | `ODU-Tracker-Portable.exe` | no install needed |
            | Linux | `odu-tracker-amd64.deb` | `sudo dpkg -i odu-tracker-amd64.deb` |
            | Android | `ODU-Tracker.apk` | sideload, connect to ODU Wi-Fi |

            Engine-only fallback (auto-used by the Electron shell when missing):
            `odu-tracker-engine-windows-x64.exe`.

            Created by **anakincoco** — srimpkoyonko@gmail.com
          files: rel/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
